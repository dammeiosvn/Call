name: QuickCall validation and native signing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quick-call-image/src/**'
      - 'quick-call-image/config/**'
      - 'quick-call-image/tests/**'
      - 'quick-call-image/vendor/**'
      - '.github/workflows/quickcall-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install independent test oracle
        run: python -m pip install -r quick-call-image/requirements-test.txt
      - name: Rebuild and validate native graph
        run: |
          python quick-call-image/src/catalog.py
          python quick-call-image/src/build.py
          python quick-call-image/tests/test_workflow.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QuickCall-validation
          path: quick-call-image/qa/
          retention-days: 14
  native-signing:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild signing inputs
        run: |
          python quick-call-image/src/catalog.py
          python quick-call-image/src/build.py
      - name: Attempt Apple native signing
        id: sign
        continue-on-error: true
        run: python quick-call-image/src/sign_macos.py
      # Third-party signing is manual and requires explicit user approval.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: QuickCall-native-signing
          path: |
            quick-call-image/dist/Quick Call Image.shortcut
            quick-call-image/dist/Quick Call Image Test.shortcut
            quick-call-image/qa/signing.json
          retention-days: 14
